# HAS_PrepperDisk anlamca arama servisi / semantic search service
# scripts/install-homepage.sh bu dosyayı IIAB'nin nginx conf.d dizinine kurar.
# Installed into IIAB's nginx conf.d directory; the main server block includes it.
location = /search/api/search {
    proxy_pass http://127.0.0.1:8088/search?$args;
    proxy_set_header Host $host;
}

location = /search/api/health {
    proxy_pass http://127.0.0.1:8088/health;
    proxy_set_header Host $host;
}
