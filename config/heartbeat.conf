# HAS_PrepperDisk uzaktan nabız ayarları / remote heartbeat settings
# scripts/install-heartbeat.sh bu dosyayı /etc/has-heartbeat.conf'a yazar.
# It writes the settings to /etc/has-heartbeat.conf; on an installed box that file is live.
#
# url: sinyalin gideceği adres. Boş = nabız kapalı / empty = disabled.
# Değişkenler / variables:
#   {status}: up | down    {msg}: uyarı metni / warning text
#   {box}: box_id          {uptime}: örn. 3d12h / e.g. 3d12h
#   {disk}: doluluk yüzdesi / disk usage percent
#   {cpu}: sıcaklık, °C / temperature in °C (yoksa boş kalır / empty if unavailable)
# Examples:
#   healthchecks.io :  https://hc-ping.com/<uuid>                                      format="params"
#   Uptime Kuma     :  https://<kuma>/api/push/<token>       (push monitor)            format="params"
#   Discord webhook :  https://discord.com/api/webhooks/<id>/<token>                   format="json"
#   Telegram        :  https://api.telegram.org/bot<token>/sendMessage?chat_id=<id>    format="json"

url=""

# --- hazır biçimler / preset formats (yeni başlayanlar için / for beginners) ---
# params: sinyal ve uyarılar URL parametresi olarak gider (?status=up&msg=...)
# json:   sinyal POST gövdesinde JSON olarak gider ({"content": ..., "text": ...})
# NOT: query ya da body doluysa format yok sayılır. / if query or body is set, format is ignored.
format="params"

# --- tam özelleştirme / full customization ---
# HTTP yöntemi; boşsa otomatik: preset biçimde params->GET, json->POST;
# query/body modunda body doluysa POST, yoksa GET.
# HTTP method; empty = auto: params->GET, json->POST in preset mode;
# in query/body mode POST when body is set, otherwise GET.
method=""

# HTTP başlıkları / headers:
#   headers=("Authorization: Bearer token" "X-Box-ID: has1")
headers=()

# GET/POST sorgu şablonu / query template (URL'nin ? sonrası / after the ?):
#   query="durum={status}&mesaj={msg}"
# Değerler otomatik percent-encode edilir / values are percent-encoded.
query=""

# Gövde şablonu / body template, örn. / e.g.:
#   body='{"durum":"{status}","mesaj":"{msg}"}'
# Değerler otomatik JSON-escape edilir / values are JSON-escaped.
body=""

# --- veri seçimi / what to send ---
# disk.json'daki uyarılar sinyalle gitsin mi / send the disk.json warnings (1/0)?
# Uyarı varsa sinyal her durumda "down" gider; bu ayar yalnızca uyarı metninin
# sinyale eklenip eklenmeyeceğini belirler.
# If warnings exist the signal is "down" regardless; this only controls whether
# the warning text is included in the signal.
warnings=1

# temel metrikler de gitsin mi / also send basic metrics (1/0)?
# {uptime} {disk} {cpu} değişkenlerini doldurur / fills these variables
metrics=0

# isteğe bağlı kutu etiketi / optional box label, örn. "has1"
box_id=""

# systemd zamanlayıcı aralığı / systemd timer interval: 30min, 6h, 12h, 1d ...
# Değiştirmek için install-heartbeat.sh'ı tekrar çalıştır / re-run to change.
interval="6h"
