# HAS_PrepperDisk Herbadex çevrimdışı içerik ayarları / offline content settings
# scripts/download-herbadex.sh bu dosyayı okur ve en yeni sürümü /library/www/html/herbadex altına kurar.
# scripts/download-herbadex.sh reads this file and installs the newest release under /library/www/html/herbadex.
#
# Varyantlar / variants:
#   maxi  - resimli / with compact 640w WebP images (~13 MB indirme / download, ~445 MB disk)
#   nopic - resimsiz / text + SVG illustrations     (~7 MB indirme / download, ~436 MB disk)
#
# Lisans / license: Herbadex içeriği CC BY-NC-ND 4.0 ile sunulur — yalnızca kişisel ve ticari olmayan
# çevrimdışı kullanım içindir (personal / non-commercial offline use only; see LICENSE-CONTENT.txt).
# İndirmeyi kapatmak için HERBADEX_ENABLED=false yap / set HERBADEX_ENABLED=false to skip.

HERBADEX_ENABLED=true
HERBADEX_VARIANT=maxi
HERBADEX_MANIFEST_URL=https://herbadex.com/offline/manifest.json
