# HAS_PrepperDisk içerik listesi / content list
# Biçim / format:   <kiwix-klasörü / folder>   <dosya adı başı / file name prefix>
# scripts/download-content.sh her satır için en yeni sürümü indirir.
# The script downloads the newest version for each line.
# Klasörler / folders: https://download.kiwix.org/zim/
# Başına # koyduğun satırlar atlanır / lines starting with # are skipped.
# Boyutlar yaklaşıktır / sizes are approximate (2026-10).
#
# Semantik arama / semantic search:  satırın sonuna "index" ekle ve
#   sudo ./scripts/build-index.sh
# çalıştır. İşaretli ZIM'ler Cevher Nüve ile vektör indeksine eklenir.
# Hiçbir ZIM varsayılan olarak indekslenmez (aşağıdaki "index" örnek olarak
# duruyor, silmek serbest). Mark a line with "index" to add it; nothing is
# indexed by default (the "index" below is an example, remove it freely).

# --- Ansiklopedi / Encyclopedia ---
wikipedia       wikipedia_tr_all_maxi                  # ~9 GB
wikipedia       wikipedia_en_all_maxi                  # ~120 GB
# wikipedia     wikipedia_en_all_nopic                 # ~55 GB, resimsiz / no images (küçük diskler için / for small disks)

# --- Hayatta kalma kitapları / Survival books ---
other           zimgit-post-disaster_en                # ~615 MB  afet sonrası kitaplığı / post-disaster library
other           zimgit-water_en                        # ~20 MB   su arıtma / water treatment
other           zimgit-food-preparation_en             # ~93 MB   gıda hazırlama ve saklama / food for preppers
other           zimgit-knots_en                        # ~27 MB   düğümler / knots
zimit           solar.lowtechmagazine.com_mul_all      # ~670 MB  düşük teknoloji çözümler / low-tech solutions
zimit           ready.gov_en_all                       # ~1.9 GB  ABD afet hazırlık rehberi / US disaster preparedness  index  # örnek / example

# --- Sağlık / Health ---
wikipedia       wikipedia_en_medicine_maxi             # ~2 GB    WikiMed
other           wikem_en_all_maxi                      # ~260 MB  acil tıp / emergency medicine
other           mdwiki_en_all_maxi                     # ~2.1 GB  tıp ansiklopedisi / medical encyclopedia
other           zimgit-medicine_en                     # ~67 MB   tıp kitapları / medical books
zimit           fas-military-medicine_en               # ~78 MB   askeri sahra tıbbı / military field medicine
zimit           nhs.uk_en_medicines                    # ~15 MB   ilaç bilgileri / medicines A-Z

# --- Tamir ve beceriler / Repair & skills ---
ifixit          ifixit_en_all                          # ~3 GB    tamir rehberleri / repair guides
stack_exchange  diy.stackexchange.com_en_all           # ev tamiri / home improvement
stack_exchange  gardening.stackexchange.com_en_all     # bahçecilik / gardening
stack_exchange  cooking.stackexchange.com_en_all       # yemek / cooking
stack_exchange  ham.stackexchange.com_en_all           # amatör telsiz / amateur radio
stack_exchange  mechanics.stackexchange.com_en_all     # araç bakımı / vehicle repair
stack_exchange  outdoors.stackexchange.com_en_all      # doğa ve kamp / outdoors
stack_exchange  sustainability.stackexchange.com_en_all # sürdürülebilirlik / sustainability

