# HAS_PrepperDisk "Telefona indir": ZIM dosyaları ve listeleri, Kiwix Android uygulaması.
# Internet-in-a-Box bu klasördeki dosyaları server bloğunun içine ekler.
# ZIM files and their JSON list plus the Kiwix Android app, for phones.
# Internet-in-a-Box includes files from /etc/nginx/conf.d inside its server block.
location ^~ /telefon/zim/ {
    alias /library/zims/content/;
    autoindex on;
    autoindex_format json;
    # Tek bir indirme hotspot'u tıkamasın / one download must not choke the hotspot
    limit_rate 2m;
}
location ^~ /telefon/ {
    limit_rate 2m;
}
