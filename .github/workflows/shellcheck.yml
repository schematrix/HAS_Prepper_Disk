name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
