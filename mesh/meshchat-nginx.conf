# HAS_PrepperDisk mesh sohbet: http://box.lan/mesh/ -> 127.0.0.1:8095
# Internet-in-a-Box bu klasördeki dosyaları server bloğunun içine ekler.
# Internet-in-a-Box includes files from /etc/nginx/conf.d inside its server block.
location = /mesh {
    return 301 /mesh/;
}
location ^~ /mesh/ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host      $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 8k;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:8095/;
}
