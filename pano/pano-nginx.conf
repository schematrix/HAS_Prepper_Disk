# HAS_PrepperDisk Güvendeyim panosu: http://box.lan/pano/ -> 127.0.0.1:8098
# Internet-in-a-Box bu klasördeki dosyaları server bloğunun içine ekler.
# Internet-in-a-Box includes files from /etc/nginx/conf.d inside its server block.
location ^~ /pano/ {
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 4k;
    proxy_read_timeout 10s;
    proxy_pass http://127.0.0.1:8098/;
}
